<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --app-blue: #2d5ca8;
      --app-blue-dark: #244b8d;
      --app-green: #2e9b50;
      --app-text: #263238;
      --app-muted: #627184;
      --app-surface: #ffffff;
      --app-page: #f7f9fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--app-text);
      background: var(--app-page);
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      font-size: 17px;
    }

    .app-header {
      background: var(--app-blue);
      box-shadow: 0 2px 8px rgba(35, 69, 125, 0.18);
    }

    .app-header-inner {
      display: flex;
      align-items: center;
      width: min(100% - 40px, 1380px);
      height: 70px;
      margin: 0 auto;
    }

    .app-brand {
      color: #fff;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .app-header-inner .app-brand {
      flex: 0 0 auto;
    }

    .menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 24px;
      height: 19px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .menu-toggle:focus-visible,
    .app-nav a:focus-visible {
      outline: 3px solid #b9d7ff;
      outline-offset: 3px;
    }

    .menu-toggle span {
      display: block;
      width: 24px;
      height: 3px;
      border-radius: 1px;
      background: #fff;
    }

    .app-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }

    .app-nav a,
    .app-nav span {
      color: #fff;
      font-size: 16px;
      text-decoration: none;
    }

    .app-nav a {
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 5px;
    }

    .app-nav a:hover,
    .app-nav a[aria-current="page"] {
      background: rgba(255, 255, 255, 0.18);
    }

    .app-nav a[aria-current="page"] {
      box-shadow: inset 0 -3px 0 #fff;
      font-weight: 700;
    }

    .app-nav .nav-login-status {
      margin-left: 8px;
      padding-left: 12px;
      border-left: 1px solid rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 860px) {
      .app-header-inner {
        position: relative;
      }

      .menu-toggle {
        display: inline-flex;
        margin-left: auto;
      }

      .app-nav {
        display: none;
        position: absolute;
        top: 70px;
        right: 0;
        left: 0;
        z-index: 10;
        padding: 12px 20px 16px;
        background: var(--app-blue-dark);
        box-shadow: 0 5px 10px rgba(35, 69, 125, 0.2);
        text-align: right;
      }

      .app-nav.is-open {
        display: block;
      }

      .app-nav a,
      .app-nav span {
        display: block;
      }

      .app-nav a {
        margin: 2px 0;
      }

      .app-nav .nav-login-status {
        margin: 8px 0 0;
        padding: 8px 10px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.4);
        border-left: 0;
      }
    }

    .app-main {
      width: min(100% - 40px, 920px);
      margin: 32px auto 72px;
    }

    @media (max-width: 600px) {
      .app-header-inner {
        width: calc(100% - 32px);
      }

      .app-brand {
        font-size: 21px;
      }

      .app-main {
        width: calc(100% - 24px);
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-brand">防災アプリ</div>
      <button class="menu-toggle" type="button" aria-label="メニューを開く" aria-controls="appNav" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="app-nav" id="appNav">
      <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>ホーム</a>
      <a href="/shelter_search" {% if request.path.startswith('/shelter_search') or request.path.startswith('/search_results') or request.path.startswith('/all_shelters') %}aria-current="page"{% endif %}>避難所検索</a>
      <a href="/shelter_register" {% if request.path.startswith('/shelter_register') %}aria-current="page"{% endif %}>避難所登録</a>
      <a href="/board" {% if request.path.startswith('/board') %}aria-current="page"{% endif %}>指示・発信ボード</a>
    {% if session.logged_in %}
      <span class="nav-login-status">ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
      <a href="/logout">ログアウト</a>
    {% else %}
      <span class="nav-login-status">未ログイン</span>
      <a href="/login" {% if request.path.startswith('/login') %}aria-current="page"{% endif %}>ログイン</a>
    {% endif %}
    </nav>
  </header>

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const menuButton = document.querySelector('.menu-toggle');
      const menu = document.getElementById('appNav');

      menuButton.addEventListener('click', function() {
        const isOpen = menu.classList.toggle('is-open');
        menuButton.setAttribute('aria-expanded', String(isOpen));
        menuButton.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
      });

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' && menu.classList.contains('is-open')) {
          menu.classList.remove('is-open');
          menuButton.setAttribute('aria-expanded', 'false');
          menuButton.setAttribute('aria-label', 'メニューを開く');
          menuButton.focus();
        }
      });
    });
  </script>
</body>
</html>
